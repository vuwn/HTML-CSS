<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
</head>
<body>
  
  <form>

    <label for="username">username:</label>
    <input class="info" id="username" type="text" placeholder="Vincent"> <br>

    <label for="password">password:</label>
    <input class="info" id="password" type="password"> <br>

    <label for="email">email:</label>
    <input class="info" id="email" type="email" placeholder="user@email.com"> <br>
    
    <label for="phone">phone #:</label>
    <input class="info" id="phone" type="phone" placeholder="0123456789" pattern="[0-9]{10}"> <br>
  
    <label for="birthdate">birthdate:</label>
    <input class="info" id="birthdate" type="date"> <br>

    <label for="quantity">quantity:</label>
    <input class="info" id="quantity" type="number" min="0" max="15" value="1"> <br>

    <label class='info' id="title">title: </label>

    <label for="Mr.">Mr.s</label>
    <input id="Mr." type="radio" name="title" value="Mr.">
    <label for="Ms.">Ms.</label>
    <input id="Ms." type="radio" name="title" value="Ms.">
    <label for="PhD.">PhD.</label>
    <input id="PhD." type="radio" name="title" value="PhD."> <br>
    
    <label for="payment">payment</label>
    <select class="info"id="payment">

      <option value="visa">visa</option>
      <option value="mastercard">mastercard</option>
      <option value="giftcard">giftcard</option> 

    </select> <br>

    <label for="Doyouloveme">Doyouloveme:</label>
    <input class="info" id="Doyouloveme" type="checkbox" value="true"> <br>

    <button type="reset">reset</button> <br>
    <button type="submit" onsubmit="submit()">submit</button>
    
  </form>

  <p id="yourInfo">Your info</p>
  <script src="index.js"></script>
</body>
</html>
